name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - name: Build and test backend
        run: mvn -f backend/pom.xml clean verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  api-journeys:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      MYSQL_ROOT_PASSWORD: ci-root-password
      MYSQL_APP_PASSWORD: ci-app-password
      APP_JWT_SECRET: ci-only-secret-key-for-tests-1234567890
      APP_SEED_DEMO_USERS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start app stack
        run: docker compose up --build -d
      - name: Wait for backend
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8082/api/hotels > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1
      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm ci
      - name: Run API journey tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop app stack
        if: always()
        run: docker compose down
